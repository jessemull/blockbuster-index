<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Consolas', 'Liberation Mono', monospace;
        background-color: #181a2b;
        color: #f4dd32;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 576px;
        width: 100%;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 24px;
        font-weight: bold;
      }

      p {
        font-size: 1.125rem;
        color: #e5e7eb;
        margin-bottom: 24px;
        line-height: 1.75rem;
      }

      a {
        color: #f4dd32;
        font-size: 1.25rem;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Page Not Found</h1>
      <p>The page you requested does not exist or has moved.</p>
      <a href="/">Home</a>
    </div>
  </body>
</html>
